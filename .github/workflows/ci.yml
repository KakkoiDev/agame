name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
