name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Browser WASM build
        run: GOOS=js GOARCH=wasm go build -o /tmp/agame.wasm ./cmd/agame-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser bundle
        working-directory: browser
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run check
          npm run build
      - name: Browser smoke test
        working-directory: browser
        run: |
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js
          GOOS=js GOARCH=wasm go build -o agame.wasm ../cmd/agame-wasm
          npx playwright install --with-deps chromium
          npm run smoke
